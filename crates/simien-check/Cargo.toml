[package]
name = "simien-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Type-checks a Simien project with tsrs, the Rust port of the TypeScript 7 checker"
publish = false

[[bin]]
name = "simien-check"
path = "src/main.rs"

# tsrs isn't on crates.io yet; pinned to a commit until it is. Bump the rev
# deliberately, and run the tests, when moving to a newer tsrs.
[dependencies]
tsrs_execute = { git = "https://github.com/oxc-project/tsrs", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
